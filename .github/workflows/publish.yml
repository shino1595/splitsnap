# Publishes SplitSnap (app/) with EAS Update on every push to main that changes the app, so
# the iPhone's Expo Go (SDK 58) gets the new version. Runs on GitHub's servers; needs the repo
# secret EXPO_TOKEN. See roadmap/04_Publish_With_EAS_Update.md.
# The unit tests and the type check (check.yml) run first; nothing is published if either fails.
name: Publish SplitSnap (EAS Update)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/publish.yml'

jobs:
  check:
    uses: ./.github/workflows/check.yml

  update:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Check versions match Expo SDK 58
        run: npx expo install --check

      # OCR_SPACE_KEY (optional repo secret) is a free OCR.space key that Expo inlines into the app,
      # so scans work without a key in Settings. It ships inside the public bundle: free keys only.
      # Without it the app falls back to the shared demo key.
      - name: Publish update
        env:
          EXPO_PUBLIC_OCR_SPACE_KEY: ${{ secrets.OCR_SPACE_KEY }}
        run: |
          if [ -z "$EXPO_PUBLIC_OCR_SPACE_KEY" ]; then
            echo "::warning::Repo secret OCR_SPACE_KEY is not set, so scans use the shared OCR.space demo key."
          fi
          eas update --branch main --message "SplitSnap ${{ github.sha }}" --environment production --non-interactive

      # The fixed "always latest" link (roadmap/05) names channel "main", not an update, so the
      # channel must exist and serve branch "main". Creating it fails harmlessly once it exists.
      - name: Point channel main at branch main
        run: |
          eas channel:create main --non-interactive || echo "Channel main already exists."
          eas channel:edit main --branch main --non-interactive
